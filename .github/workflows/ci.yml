name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Syntax (PHP ${{ matrix.php }}) and versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin header says "Requires PHP: 8.0".
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l on the plugin, tests and tooling
        run: find prestaspot tests bin build-package.php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Every version number agrees
        run: php bin/check-version.php

  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PHPUnit 11 needs PHP 8.2+.
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer test

  integration:
    name: Integration (WordPress + PrestaShop)
    runs-on: ubuntu-latest
    env:
      CI_PS_HOST: localhost
      CI_PS_PORT: '8180'
      # CI-only key; bin/ci-seed-prestashop.sh creates it in the throwaway shop.
      PRESTASPOT_TEST_API_KEY: PRESTASPOTCITESTKEY00000000000AB
      PRESTASPOT_TEST_SHOP_URL: http://localhost:8180
      WP_TESTS_LIB_DIR: ${{ github.workspace }}/.wp-tests-lib
      WP_TESTS_DIR: ${{ github.workspace }}/.wp-tests-lib/tests-lib
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - name: Start a throwaway PrestaShop and seed the test fixtures
        run: |
          docker compose -f .docker/ci-compose.yml up -d
          bash bin/ci-seed-prestashop.sh
      - run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1
      - run: composer test-integration
      - name: PrestaShop logs
        if: failure()
        run: docker compose -f .docker/ci-compose.yml logs --tail=100

  package:
    name: Build and check the release ZIP
    runs-on: ubuntu-latest
    needs: [lint, unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
      - run: php build-package.php
      - run: php bin/check-package.php .releases/prestaspot-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: prestaspot-zip
          # .releases/ is a dot-folder, which upload-artifact skips by default.
          include-hidden-files: true
          path: |
            .releases/prestaspot-*.zip
            .releases/prestaspot-*.zip.sha256
          if-no-files-found: error
