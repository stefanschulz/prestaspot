name: Release

# Pushing a tag vX.Y.Z publishes that version: the version numbers must all
# match the tag, the whole CI must pass, and the release notes are taken from
# that version's section of .doc/CHANGES.md. The ZIP people download is the
# one CI built and checked. If any step fails, nothing is published.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Tag, versions and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: The tag matches every version number
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::The tag $TAG is not of the form vX.Y.Z."
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          php bin/check-version.php --expect="$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release notes from .doc/CHANGES.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tr -d '\r' < .doc/CHANGES.md \
            | awk -v v="$VERSION" 'index($0, "## " v " ") == 1 { found = 1; next } found && /^## / { exit } found { print }' \
            > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::.doc/CHANGES.md has no section '## $VERSION (...)' with notes."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the GitHub release
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prestaspot-zip
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/prestaspot-$VERSION.zip" \
            "release/prestaspot-$VERSION.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "PrestaSpot $VERSION" \
            --notes-file release/release-notes.md --verify-tag
